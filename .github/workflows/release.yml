name: Release French Typos

on:
    push:
        tags:
            - '[0-9]*'

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Use Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '26.12.0'
                  cache: 'npm'

            - name: Validate and build
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  npm ci --ignore-scripts --no-audit --no-fund
                  node -e 'const assert = require("node:assert/strict"); assert.equal(process.env.RELEASE_TAG, require("./manifest.json").version); assert.equal(require("./package.json").version, process.env.RELEASE_TAG);'
                  npm run lint
                  npm run build

            - name: Attest build provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Publish plugin
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  gh release create "$RELEASE_TAG" main.js manifest.json styles.css \
                    --verify-tag --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG"
